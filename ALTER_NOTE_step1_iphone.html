<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ALTER NOTE – Step 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(145deg,#eee9ff,#dcf8f5);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Segoe UI",sans-serif;color:#292450;overscroll-behavior:none}
.app{max-width:430px;min-height:100vh;margin:auto;padding:18px 16px 35px}
.hero{background:linear-gradient(145deg,#7569df,#ad98f4);color:#fff;border-radius:28px;padding:22px;text-align:center;box-shadow:0 12px 30px #4b3c9b25}
.logo{font-size:38px;font-weight:900;letter-spacing:-2px}.logo span{color:#77dfff}.logo b{color:#ffb35d}
h2{margin:6px 0;font-size:22px}.sub{margin:5px 0 0;opacity:.95}
.card{background:#fff;border-radius:25px;padding:18px;margin-top:15px;box-shadow:0 8px 25px #423a7b15}
.label{text-align:center;color:#777;font-size:14px}
.noteBox{display:flex;justify-content:center;align-items:center;gap:18px;margin:10px 0 18px}
.note{font-size:82px;line-height:1;font-weight:900;min-width:145px;text-align:center}
.speaker{width:58px;height:58px;border:0;border-radius:18px;background:#25bdb4;color:#fff;font-size:27px}
.notes{display:flex;gap:6px;margin-bottom:17px}
.notes button{flex:1;padding:11px 3px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:19px;font-weight:700;color:#302b54}
.notes button.active{border:2px solid #25bdb4;background:#e7fbf8}
.instruction{text-align:center;font-weight:800;margin:5px 0 12px}
.drop{height:92px;border:3px dashed #b9b5cc;border-radius:20px;display:flex;justify-content:center;align-items:center;background:#fafaff;color:#777;transition:.15s;position:relative}
.drop.over{border-color:#25bdb4;background:#e8fffb;transform:scale(1.02)}
.drop strong{font-size:22px;color:#302b54}
.symbols{display:flex;justify-content:center;gap:13px;margin-top:15px}
.sym{width:78px;height:78px;border:0;border-radius:22px;color:#fff;font-size:39px;font-weight:900;box-shadow:0 6px 12px #0002;touch-action:none;user-select:none}
.sym small{display:block;font-size:11px;margin-top:-4px}
.sharp{background:#24b9b1}.flat{background:#ee6a82}.natural{background:#efa92a}
.history{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:18px;font-size:23px}
.bubble{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid #ddd;background:#f8f8fc;font-weight:800}
.bubble.active{background:#25bdb4;color:#fff;border-color:#25bdb4}
.result{text-align:center;margin-top:13px;font-size:15px;color:#666}
.stats{display:flex;justify-content:space-around;text-align:center;margin-top:14px}.stats b{font-size:24px}
.tip{background:#fff8d8;border-radius:18px;padding:13px;margin-top:15px;font-size:14px;line-height:1.5}
.reset{display:block;margin:16px auto 0;border:0;background:#eeeaf9;border-radius:14px;padding:10px 18px;color:#413b68;font-weight:700}
.dragGhost{position:fixed;z-index:99;pointer-events:none;width:78px;height:78px;border-radius:22px;display:grid;place-items:center;color:#fff;font-size:39px;font-weight:900;box-shadow:0 12px 25px #0003;transform:translate(-50%,-50%) scale(1.05)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#292450;color:#fff;padding:12px 17px;border-radius:15px;font-weight:800;opacity:0;transition:.2s;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="logo"><span>ALTER</span> <b>NOTE</b></div>
    <div>ขั้นที่ 1 • ทดลองลาก ♯ ♭ แล้วฟังเสียง</div>
  </div>

  <div class="card">
    <div class="label">เลือกโน้ต</div>
    <div class="noteBox">
      <div class="note" id="note">C</div>
      <button class="speaker" id="speaker" aria-label="เล่นเสียง">🔊</button>
    </div>
    <div class="notes" id="notes"></div>

    <div class="instruction">ลากเครื่องหมายไปใส่ในช่อง</div>
    <div class="drop" id="drop">
      <span>ลาก ♯ หรือ ♭ มาที่นี่</span>
    </div>

    <div class="symbols">
      <button class="sym sharp" data-symbol="sharp">♯<small>ชาร์ป</small></button>
      <button class="sym flat" data-symbol="flat">♭<small>แฟลต</small></button>
      <button class="sym natural" data-symbol="natural">♮<small>เนเจอรัล</small></button>
    </div>

    <div class="history">
      <div class="bubble" id="before">C</div><b>→</b>
      <div class="bubble active" id="after">C</div>
    </div>
    <div class="result" id="result">ลองลากเครื่องหมายดูครับ</div>
  </div>

  <div class="card stats">
    <div>⭐<br><b id="score">0</b><br>คะแนน</div>
    <div>🎧<br><b id="count">0</b><br>ทดลอง</div>
  </div>

  <div class="tip">
    <b>เป้าหมายของขั้นนี้</b><br>
    เลือก C แล้วลาก ♯ → จะได้ C♯ และเสียงสูงขึ้นครึ่งเสียง<br>
    เลือก C แล้วลาก ♭ → จะได้ C♭ และเสียงต่ำลงครึ่งเสียง
  </div>
  <button class="reset" id="reset">เริ่มคะแนนใหม่</button>
</div>

<div class="toast" id="toast"></div>

<script>
const F={
"C":261.6256,"C#":277.1826,"Db":277.1826,"Cb":246.9417,"B#":261.6256,
"D":293.6648,"D#":311.1270,"Eb":311.1270,"Db#":329.6276,
"E":329.6276,"E#":349.2282,"Fb":311.1270,
"F":349.2282,"F#":369.9944,"Gb":369.9944,
"G":391.9954,"G#":415.3047,"Ab":415.3047,
"A":440,"A#":466.1638,"Bb":466.1638,
"B":493.8833
};
const natural=["C","D","E","F","G","A","B"];
let current="C", symbol="", score=0, count=0, audioCtx=null;

const $=id=>document.getElementById(id);
function renderNotes(){
  const box=$("notes"); box.innerHTML="";
  natural.forEach(n=>{
    const b=document.createElement("button"); b.textContent=n;
    if(n===current)b.classList.add("active");
    b.onclick=()=>{current=n;symbol="";render()};
    box.appendChild(b);
  });
}
function noteName(){
  if(symbol==="sharp")return current+"♯";
  if(symbol==="flat")return current+"♭";
  return current;
}
function audioName(){
  if(symbol==="sharp"){
    if(current==="E")return "F";
    if(current==="B")return "C";
    return current+"#";
  }
  if(symbol==="flat"){
    if(current==="C")return "B";
    if(current==="F")return "E";
    return current==="D"?"Db":current==="G"?"Gb":current==="A"?"Ab":"Bb";
  }
  return current;
}
function play(note=audioName()){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=F[note]||F["C"];
    g.gain.setValueAtTime(.001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.23,audioCtx.currentTime+.035);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.85);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.9);
  }catch(e){toast("แตะปุ่ม 🔊 เพื่อเปิดเสียงครับ")}
}
function render(){
  $("note").textContent=noteName(); $("before").textContent=current; $("after").textContent=noteName();
  $("result").textContent=symbol?`เสียงปัจจุบัน: ${noteName()} • กด 🔊 เพื่อฟังอีกครั้ง`:"ลองลากเครื่องหมายดูครับ";
  renderNotes();
}
function toast(t){const x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1300)}
$("speaker").onclick=()=>play();
$("reset").onclick=()=>{score=0;count=0;$("score").textContent=0;$("count").textContent=0;toast("เริ่มคะแนนใหม่แล้วครับ")};

function apply(sym){
  symbol=sym; count++; score+=10;
  $("score").textContent=score; $("count").textContent=count;
  render(); play();
  toast(`ถูกเปลี่ยนเป็น ${noteName()} • +10 ⭐`);
}
const drop=$("drop");
document.querySelectorAll(".sym").forEach(btn=>{
  btn.addEventListener("pointerdown",ev=>{
    ev.preventDefault();
    const sym=btn.dataset.symbol;
    const ghost=document.createElement("div");ghost.className="dragGhost";
    ghost.textContent=sym==="sharp"?"♯":sym==="flat"?"♭":"♮";
    ghost.style.background=getComputedStyle(btn).background;
    document.body.appendChild(ghost);
    function move(e){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";const r=drop.getBoundingClientRect();const over=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;drop.classList.toggle("over",over)}
    function end(e){
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",end);
      const r=drop.getBoundingClientRect();
      const over=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
      ghost.remove();drop.classList.remove("over");
      if(over)apply(sym); else toast("ลากมาวางในช่องเส้นประครับ");
    }
    document.addEventListener("pointermove",move,{passive:false});
    document.addEventListener("pointerup",end,{once:false});
    move(ev);
  });
});
render();
</script>
</body>
</html>
